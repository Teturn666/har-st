<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title></title>
    <script src="./xlsx.full.min.js"></script>
  </head>
  <body></body>
  <script>
    const TAG = "webParseExcel";

    /**
     * 解析 Excel 数据并返回题库结构
     * @param {ArrayBuffer|string} excelData - Excel 文件的 ArrayBuffer 或 Base64 字符串
     * @param {string} [fileName="题库"] - 题库名称（用于生成 name 和 desc）
     * @returns {{quizBank: object, questions: Array<object>}}
     * 举例 const base64Data = "UEsDBBQABgAIAAAAIQ..."; // 省略完整 Base64
     * const result = parseExcelQuizBank(base64Data, "myQuiz.xlsx");
     */
    function generateShortTimestampNumber() {
      const now = new Date();
      return (
        now.getFullYear() * 10000000000 +
        (now.getMonth() + 1) * 100000000 +
        now.getDate() * 1000000 +
        now.getHours() * 10000 +
        now.getMinutes() * 100 +
        now.getSeconds()
      );
    }

    function parseExcelQuizBank(fileName, excelData) {
      console.log(TAG, "开始解析:", fileName);
      console.log(TAG, "数据类型:", typeof excelData);
      console.log(
        TAG,
        "数据长度:",
        excelData ? excelData.length || excelData.byteLength : "undefined"
      );

      try {
        let data;

        // 改进数据处理逻辑
        if (typeof excelData === "string") {
          console.log(TAG, "处理Base64字符串");
          const binStr = atob(excelData);
          const buf = new ArrayBuffer(binStr.length);
          const view = new Uint8Array(buf);
          for (let i = 0; i < binStr.length; i++) {
            view[i] = binStr.charCodeAt(i);
          }
          data = buf;
        } else if (excelData instanceof ArrayBuffer) {
          console.log(TAG, "处理ArrayBuffer");
          data = excelData;
        } else if (excelData instanceof Uint8Array) {
          console.log(TAG, "处理Uint8Array");
          data = excelData;
        } else {
          console.error(TAG, "不支持的数据类型:", typeof excelData);
          return null;
        }

        console.log(TAG, "开始读取工作簿");
        const workbook = XLSX.read(data, { type: "array" });
        console.log(TAG, "工作表数量:", workbook.SheetNames.length);
        console.log(TAG, "工作表名称:", workbook.SheetNames);

        if (workbook.SheetNames.length === 0) {
          console.error(TAG, "没有找到工作表");
          return null;
        }

        const qid = generateShortTimestampNumber();
        const quizBank = {
          qid: qid,
          name: fileName.replace(/\.[^/.]+$/, ""),
          desc: fileName.replace(/\.[^/.]+$/, ""),
          time: new Date().toISOString().split("T")[0],
          url: "",
          num: "0",
          version: "1.0",
          position: 0,
          downloadedState: 1,
          bankType: 2,
        };

        const questions = [];
        const questionErrorList = [];
        let globalQuestionIndex = 0;

        // 改进表头匹配函数 - 使用包含匹配
        function containsHeader(actualHeader, targetHeader) {
          if (!actualHeader) return false;
          const headerStr = String(actualHeader).trim();
          return headerStr.includes(targetHeader);
        }

        // 改进选项列识别函数 - 支持带空格的选项格式
        function isOptionHeader(header) {
          if (!header) return false;
          const headerStr = String(header).trim();

          // 匹配包含 "选项A", "选项 A", "选项B" 等格式（支持选项和字母之间有无空格）
          if (headerStr.includes("选项") && headerStr.match(/选项\s*[A-Z]/)) {
            return true;
          }

          // 匹配 "选项1", "选项2", "选项3" 等数字格式
          if (headerStr.includes("选项") && headerStr.match(/选项\s*[0-9]/)) {
            return true;
          }

          // 匹配单独的字母 "A", "B", "C", "D" 等格式（完全匹配字母，避免误匹配）
          if (headerStr.match(/^[A-Z][\*\s]*$/)) {
            return true;
          }

          return false;
        }

        // 从选项表头中提取字母 - 支持带空格的格式
        function extractOptionLetter(header) {
          if (!header) return null;
          const headerStr = String(header).trim();

          // 从包含 "选项A" 或 "选项 A" 格式中提取字母（允许空格）
          const longFormatMatch = headerStr.match(/选项\s*([A-Z])/);
          if (longFormatMatch) {
            return longFormatMatch[1];
          }

          // 从包含 "选项1" 或 "选项 1" 格式中提取数字并转换为字母
          const numberFormatMatch = headerStr.match(/选项\s*([0-9]+)/);
          if (numberFormatMatch) {
            const number = parseInt(numberFormatMatch[1]);
            // 将数字转换为字母 (1->A, 2->B, 3->C, ...)
            if (number >= 1 && number <= 26) {
              return String.fromCharCode(64 + number); // 64 + 1 = 65 = 'A'
            }
          }

          // 从 "A" 格式中提取字母（可能包含星号等特殊字符）
          const shortFormatMatch = headerStr.match(/^([A-Z])/);
          if (shortFormatMatch) {
            return shortFormatMatch[1];
          }

          return null;
        }

        /**
         * 新增：分析数据行，推断选项数量
         * @param {Array} rows - 数据行数组
         * @param {number} questionIndex - 题干列索引
         * @param {number} answerIndex - 答案列索引
         * @returns {number} - 推断的选项数量
         */
        function inferOptionCount(rows, questionIndex, answerIndex) {
          console.log(TAG, "开始分析数据行，推断选项数量...");

          let maxOptionCount = 0;
          const sampleSize = Math.min(20, rows.length); // 最多分析20行数据

          for (let i = 0; i < sampleSize; i++) {
            const row = rows[i];
            if (!row) continue;

            // 跳过题干和答案列，统计有内容的选项列数量
            let optionCount = 0;
            for (
              let j = Math.max(questionIndex + 1, answerIndex + 1);
              j < row.length;
              j++
            ) {
              const cellValue = String(row[j] || "").trim();
              if (cellValue.length > 0) {
                optionCount = j - Math.max(questionIndex, answerIndex); // 计算相对位置
              }
            }
            maxOptionCount = Math.max(maxOptionCount, optionCount);
          }

          console.log(
            TAG,
            `分析了 ${sampleSize} 行数据，推断最大选项数量: ${maxOptionCount}`
          );
          return maxOptionCount;
        }

        /**
         * 新增：自动生成选项表头
         * @param {number} optionCount - 选项数量
         * @param {number} startIndex - 选项开始的列索引
         * @returns {Array} - 生成的选项信息数组
         */
        function generateOptionHeaders(optionCount, startIndex) {
          const detectedOptions = [];
          for (let i = 0; i < optionCount; i++) {
            const letter = String.fromCharCode(65 + i); // A, B, C, D...
            detectedOptions.push({
              letter: letter,
              index: startIndex + i,
              originalHeader: `选项${letter}`, // 自动生成的表头名称
              isGenerated: true, // 标记为自动生成
            });
          }
          console.log(
            TAG,
            "自动生成选项表头:",
            detectedOptions.map((opt) => opt.originalHeader).join(", ")
          );
          return detectedOptions;
        }

        /**
         * 检查是否为判断题
         * @param {string} answer - 答案内容
         * @returns {boolean} - 是否为判断题
         */
        function isJudgmentQuestion(answer) {
          if (!answer) return false;

          const normalizedAnswer = String(answer).toLowerCase().trim();
          const judgmentKeywords = [
            "正确",
            "错误",
            "对",
            "错",
            "是",
            "否",
            "true",
            "false",
            "yes",
            "no",
            "√",
            "×",
            "right",
            "wrong",
            "correct",
            "incorrect",
          ];

          return judgmentKeywords.some((keyword) =>
            normalizedAnswer.includes(keyword.toLowerCase())
          );
        }

        /**
         * 标准化判断题答案格式
         * @param {string} originalAnswer - 原始答案
         * @returns {string} - 标准化后的答案
         */
        function standardizeJudgmentAnswer(originalAnswer) {
          if (!originalAnswer) return originalAnswer;

          const answer = String(originalAnswer).toLowerCase().trim();

          // 正确类答案
          if (
            answer.includes("正确") ||
            answer.includes("对") ||
            answer.includes("是") ||
            answer.includes("true") ||
            answer.includes("yes") ||
            answer.includes("√") ||
            answer.includes("right") ||
            answer.includes("correct")
          ) {
            return "正确";
          }

          // 错误类答案
          if (
            answer.includes("错误") ||
            answer.includes("错") ||
            answer.includes("否") ||
            answer.includes("false") ||
            answer.includes("no") ||
            answer.includes("×") ||
            answer.includes("wrong") ||
            answer.includes("incorrect")
          ) {
            return "错误";
          }

          // 如果无法识别，返回原答案
          return originalAnswer;
        }

        for (const sheetName of workbook.SheetNames) {
          console.log(TAG, "处理工作表:", sheetName);
          const worksheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          console.log(TAG, `工作表 "${sheetName}" 行数:`, rows.length);

          if (rows.length === 0) {
            console.warn(TAG, `工作表 "${sheetName}" 为空，已跳过`);
            continue;
          }

          console.log(TAG, "第一行数据:", rows[0]);

          // 改进表头检查逻辑，第一列默认为题干，只校验答案列
          const actualHeaders = rows[0] || [];
          console.log(TAG, "实际表头:", actualHeaders);

          // 【修改】第一列默认为题干列，不校验"题干"字样
          let questionIndex = 0;

          // 查找答案列位置 - 使用包含匹配
          let answerIndex = actualHeaders.findIndex((header) =>
            containsHeader(header, "答案")
          );

          // 如果找不到答案列，尝试查找其他可能的答案列名
          if (answerIndex === -1) {
            answerIndex = actualHeaders.findIndex(
              (header) =>
                containsHeader(header, "正确答案") ||
                containsHeader(header, "答") ||
                containsHeader(header, "正确")
            );
          }

          // 如果还是找不到，假设第二列为答案列
          if (answerIndex === -1 && actualHeaders.length >= 2) {
            answerIndex = 1;
            console.log(TAG, "未找到明确的答案列，假设第2列为答案列");
          }

          // 只检查是否找到答案列
          const hasRequiredHeaders = answerIndex !== -1;

          // 动态检测选项列数和位置
          let detectedOptions = [];
          let optionPositions = {};

          if (hasRequiredHeaders) {
            // 从表头中检测所有选项列
            for (let i = 0; i < actualHeaders.length; i++) {
              const header = actualHeaders[i];
              if (isOptionHeader(header)) {
                const letter = extractOptionLetter(header);
                if (letter) {
                  detectedOptions.push({
                    letter: letter,
                    index: i,
                    originalHeader: String(header).trim(),
                    isGenerated: false,
                  });
                  optionPositions[letter] = i;
                }
              }
            }

            // 【新增】如果没有检测到选项列，尝试自动推断
            if (detectedOptions.length === 0) {
              console.log(TAG, "表头中未检测到选项列，开始自动推断...");

              // 分析数据行推断选项数量
              const dataRows = rows.slice(1); // 排除表头行
              const inferredOptionCount = inferOptionCount(
                dataRows,
                questionIndex,
                answerIndex
              );

              if (inferredOptionCount > 0) {
                // 选项从答案列之后开始
                const optionStartIndex = Math.max(
                  questionIndex + 1,
                  answerIndex + 1
                );
                detectedOptions = generateOptionHeaders(
                  inferredOptionCount,
                  optionStartIndex
                );

                // 更新 optionPositions
                detectedOptions.forEach((option) => {
                  optionPositions[option.letter] = option.index;
                });

                console.log(
                  TAG,
                  `自动推断并生成了 ${inferredOptionCount} 个选项列`
                );
              } else {
                console.log(TAG, "未能推断出选项数量，可能为判断题或填空题");
              }
            }

            // 按字母顺序排序选项
            detectedOptions.sort((a, b) => a.letter.localeCompare(b.letter));
          }

          console.log(TAG, `检测到选项数量: ${detectedOptions.length}`);
          console.log(
            TAG,
            `检测到的选项:`,
            detectedOptions
              .map(
                (opt) =>
                  `${opt.letter}(${opt.originalHeader})${
                    opt.isGenerated ? "[自动生成]" : ""
                  }`
              )
              .join(", ")
          );

          if (!hasRequiredHeaders) {
            console.warn(TAG, `工作表 "${sheetName}" 表头格式不正确`);
            console.warn(TAG, "需要包含: 题干、答案");
            console.warn(TAG, "实际表头:", actualHeaders);

            // 尝试查找包含关键字的表头行 - 使用包含匹配
            let headerRowIndex = -1;
            for (let i = 0; i < Math.min(5, rows.length); i++) {
              const row = rows[i] || [];
              if (
                row.some(
                  (cell) =>
                    containsHeader(cell, "题干") || containsHeader(cell, "答案")
                )
              ) {
                headerRowIndex = i;
                break;
              }
            }

            if (headerRowIndex === -1) {
              console.warn(TAG, `工作表 "${sheetName}" 未找到有效表头，已跳过`);
              continue;
            } else {
              console.log(TAG, `在第 ${headerRowIndex + 1} 行找到表头`);
              // 重新设置表头并重新检测
              const headerRow = rows[headerRowIndex];
              rows.splice(0, headerRowIndex + 1);
              rows.unshift(headerRow);

              // 重新检测表头
              const newHeaders = headerRow || [];
              detectedOptions = [];
              optionPositions = {};

              // 重新查找题干和答案位置
              const newQuestionIndex = newHeaders.findIndex((header) =>
                containsHeader(header, "题干")
              );
              const newAnswerIndex = newHeaders.findIndex((header) =>
                containsHeader(header, "答案")
              );

              if (newQuestionIndex !== -1 && newAnswerIndex !== -1) {
                questionIndex = newQuestionIndex;
                answerIndex = newAnswerIndex;

                // 重新检测选项列
                for (let i = 0; i < newHeaders.length; i++) {
                  const header = newHeaders[i];
                  if (isOptionHeader(header)) {
                    const letter = extractOptionLetter(header);
                    if (letter) {
                      detectedOptions.push({
                        letter: letter,
                        index: i,
                        originalHeader: String(header).trim(),
                        isGenerated: false,
                      });
                      optionPositions[letter] = i;
                    }
                  }
                }

                // 如果重新检测后仍然没有选项列，再次尝试自动推断
                if (detectedOptions.length === 0) {
                  const dataRows = rows.slice(1);
                  const inferredOptionCount = inferOptionCount(
                    dataRows,
                    questionIndex,
                    answerIndex
                  );

                  if (inferredOptionCount > 0) {
                    const optionStartIndex = Math.max(
                      questionIndex + 1,
                      answerIndex + 1
                    );
                    detectedOptions = generateOptionHeaders(
                      inferredOptionCount,
                      optionStartIndex
                    );

                    detectedOptions.forEach((option) => {
                      optionPositions[option.letter] = option.index;
                    });
                  }
                }

                detectedOptions.sort((a, b) =>
                  a.letter.localeCompare(b.letter)
                );
              }
            }
          }

          // 改进数据行处理
          const validRows = rows.slice(1).filter((row) => {
            if (!row) return false;
            return !row.every(
              (cell) =>
                cell === undefined ||
                cell === null ||
                String(cell).trim() === ""
            );
          });

          console.log(
            TAG,
            `工作表 "${sheetName}" 有效数据行数:`,
            validRows.length
          );

          validRows.forEach((row, rowIndex) => {
            const actualRowNumber = rowIndex + 2;

            // 处理题干和答案
            const question = row[questionIndex] || "";
            const answer = row[answerIndex] || "";

            // 按字母顺序提取选项
            const options = [];
            detectedOptions.forEach((optionInfo) => {
              const optionValue = String(row[optionInfo.index] || "").trim();
              options.push(optionValue);
            });

            // 改进空值检查
            const questionStr = String(question || "").trim();
            const answerStr = String(answer || "").trim();
            const validOptions = options.filter((opt) => opt.length > 0);
            const hasValidOptions = validOptions.length > 0;

            let errorMsg = "";
            let finalOptions = validOptions; // 最终使用的选项数组
            let finalAnswer = answerStr; // 最终使用的答案

            if (!questionStr && !answerStr) {
              errorMsg = "无法提取,题干和答案均为空";
            } else if (!questionStr) {
              errorMsg = "无法提取,题干为空";
            } else if (!answerStr) {
              errorMsg = "无法提取,答案为空";
            } else if (!hasValidOptions) {
              // ===== 新增：判断题处理逻辑 =====

              if (isJudgmentQuestion(answerStr)) {
                console.log(
                  TAG,
                  `第 ${actualRowNumber} 行识别为判断题，自动生成选项`
                );

                // 为判断题自动生成"正确"和"错误"选项
                finalOptions = ["正确", "错误"];

                // 标准化答案格式
                finalAnswer = standardizeJudgmentAnswer(answerStr);

                console.log(
                  TAG,
                  `判断题处理结果 - 原答案: "${answerStr}", 标准化答案: "${finalAnswer}"`
                );
              } else {
                errorMsg = "无法提取,所有选项为空且非判断题";
              }
            } else {
              // 如果有选项但可能是判断题，也进行答案标准化
              if (isJudgmentQuestion(answerStr)) {
                finalAnswer = standardizeJudgmentAnswer(answerStr);
                console.log(
                  TAG,
                  `第 ${actualRowNumber} 行检测为判断题类型，答案已标准化: "${finalAnswer}"`
                );
              }
            }

            if (errorMsg) {
              questionErrorList.push({
                sheetName: sheetName,
                row: actualRowNumber,
                error: errorMsg,
                data: [questionStr, answerStr, ...options],
              });
              console.warn(TAG, `第 ${actualRowNumber} 行: ${errorMsg}`, [
                questionStr,
                answerStr,
                ...options,
              ]);
              return;
            }

            questions.push({
              qId: qid,
              question: questionStr,
              option: finalOptions, // 使用处理后的选项（可能是自动生成的）
              answer: finalAnswer, // 使用标准化后的答案
              wrongAnswer: "",
              questionID: globalQuestionIndex + 1,
            });

            globalQuestionIndex++;
          });
        }

        quizBank.num = questions.length.toString();

        console.log(TAG, "解析完成");
        console.log(TAG, "题库信息:", quizBank);
        console.log(TAG, "题目数量:", questions.length);
        console.log(TAG, "错误列表数量:", questionErrorList.length);

        const result = { quizBank, questions, questionErrorList };

        // 确保返回有效结果
        if (questions.length === 0) {
          console.warn(TAG, "没有解析到有效题目");
          return {
            quizBank,
            questions: [],
            questionErrorList,
            warning: "没有解析到有效题目，请检查Excel文件格式",
          };
        }

        return result;
      } catch (error) {
        console.error(TAG, "解析失败:", error);
        console.error(TAG, "错误堆栈:", error.stack);
        return null;
      }
    }
  </script>
</html>
