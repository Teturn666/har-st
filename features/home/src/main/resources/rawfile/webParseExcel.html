<!DOCTYPE html>
<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>WebView Message Port Demo</title>
    <script src="./xlsx.full.min.js"></script>
  </head>
  <body></body>
  <script>
    const TAG = "webParseExcel";

    /**
     * 解析 Excel 数据并返回题库结构
     * @param {ArrayBuffer|string} excelData - Excel 文件的 ArrayBuffer 或 Base64 字符串
     * @param {string} [fileName="题库"] - 题库名称（用于生成 name 和 desc）
     * @returns {{quizBank: object, questions: Array<object>}}
     * 举例 const base64Data = "UEsDBBQABgAIAAAAIQ..."; // 省略完整 Base64
     * const result = parseExcelQuizBank(base64Data, "myQuiz.xlsx");
     */

    function generateShortTimestampNumber() {
      const now = new Date();
      return (
        now.getFullYear() * 10000000000 +
        (now.getMonth() + 1) * 100000000 +
        now.getDate() * 1000000 +
        now.getHours() * 10000 +
        now.getMinutes() * 100 +
        now.getSeconds()
      );
    }

    function parseExcelQuizBank(fileName, excelData) {
      try {
        let data;

        if (typeof excelData === "string") {
          const binStr = atob(excelData);
          const buf = new Uint8Array(binStr.length);
          for (let i = 0; i < binStr.length; i++) {
            buf[i] = binStr.charCodeAt(i);
          }
          data = buf;
        } else {
          data = excelData;
        }

        const workbook = XLSX.read(data, { type: "array" });
        const qid = generateShortTimestampNumber();
        const quizBank = {
          qid: qid,
          name: fileName.replace(/\.[^/.]+$/, ""),
          desc: fileName.replace(/\.[^/.]+$/, ""),
          time: new Date().toISOString().split("T")[0],
          url: "",
          num: "0",
          version: "1.0",
          position: 0,
          downloadedState: 1,
          bankType: 2,
        };

        const questions = [];
        const questionErrorList = [];
        let globalQuestionIndex = 0;

        for (const sheetName of workbook.SheetNames) {
          const worksheet = workbook.Sheets[sheetName];
          const rows = XLSX.utils.sheet_to_json(worksheet, { header: 1 });

          if (
            !rows[0] ||
            rows[0].slice(0, 6).join(",") !==
              "题干,答案,选项A,选项B,选项C,选项D"
          ) {
            console.warn(`工作表 "${sheetName}" 表头格式不正确，已跳过`);
            continue;
          }

          const validRows = rows.slice(1).filter((row) => {
            return !row.every(
              (cell) => cell === undefined || String(cell).trim() === ""
            );
          });

          validRows.slice(1).forEach((row, rowIndex) => {
            const actualRowNumber = rowIndex + 2;
            const paddedRow = row.concat(Array(6 - row.length).fill(""));
            const [question, answer, optionA, optionB, optionC, optionD] =
              paddedRow;

            // 拆分为具体错误判断
            const isQuestionEmpty = !String(question).trim();
            const isAnswerEmpty = !String(answer).trim();
            const areAllOptionsEmpty = ![
              optionA,
              optionB,
              optionC,
              optionD,
            ].some((opt) => String(opt).trim());
            let errorMsg = "";

            if (isQuestionEmpty && isAnswerEmpty) {
              errorMsg = " 无法提取,题干和答案均为空";
            } else if (isQuestionEmpty) {
              errorMsg = "无法提取,题干为空";
            } else if (isAnswerEmpty) {
              errorMsg = "无法提取,答案为空";
            } else if (areAllOptionsEmpty) {
              errorMsg = "无法提取,所有选项为空";
            }

            if (errorMsg) {
              questionErrorList.push({
                sheetName: sheetName,
                row: actualRowNumber,
                error: errorMsg,
              });
              return;
            }

            questions.push({
              qId: qid,
              question: question || "",
              option: [optionA, optionB, optionC, optionD].filter(
                (opt) => opt !== ""
              ),
              answer: answer || "",
              wrongAnswer: "",
              questionID: globalQuestionIndex + 1,
            });

            globalQuestionIndex++;
          });
        }

        quizBank.num = questions.length.toString();
        return { quizBank, questions, questionErrorList };
      } catch (error) {
        console.error(TAG, "解析失败:" + error);
        throw error;
      }
    }
  </script>
</html>
